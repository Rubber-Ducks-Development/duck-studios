name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 12 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: csharp
          build-mode: manual
      - run: dotnet build Editor/WeftStudio.csproj -c Release
      - run: dotnet build Installer/DuckStudio.Setup.csproj -c Release -p:BrandingRoot="${{ github.workspace }}/Editor/Assets"
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
  dependencies:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@907a6e9569212033966bc0b69d32473b046dd66b
        with:
          fail-on-severity: low
  rust-advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rustup update stable
      - run: cargo +stable install cargo-audit --locked --version 0.22.2
      - run: cargo audit --file Renderer/Cargo.lock
