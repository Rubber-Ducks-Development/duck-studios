<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Duck Studio test companion</title><style>
*{box-sizing:border-box}body{margin:0;font:14px 'Segoe UI',sans-serif;color:#eee;background:transparent}main{display:none;width:360px;margin:24px;padding:20px;background:#303032;border:1px solid #626266;max-height:92vh;overflow:auto}h1{font-size:21px;margin:0 0 16px}h2{font-size:15px;margin:22px 0 8px}button,input,select{font:inherit;color:#eee;background:#4e5055;border:1px solid #717376;padding:8px}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #e7b343;outline-offset:2px}input,select{width:100%;margin:5px 0 9px}label{display:block;color:#ccc;font-size:12px}#items button,#outfits button,#tattoos button{width:100%;text-align:left;margin:3px 0}#status{font-size:12px;line-height:1.6;color:#ddd;margin:12px 0}p{color:#ccc;font-size:12px;line-height:1.6}
</style></head><body><main id="panel"><h1>Duck Studio</h1><p>Preview your built pack on a local test character.</p><button id="close">Close · Esc</button><label for="search">Search clothing, outfits and tattoos</label><input id="search" type="search"><label for="texture">Texture variation (starts at 0)</label><input id="texture" type="number" value="0" min="0" max="25"><label for="pose">Game animation</label><select id="pose"><option value="standing">Standing</option><option value="walking">Walking</option><option value="running">Running</option><option value="sitting">Sitting</option><option value="aiming">Aiming</option></select><div id="status" role="status"></div><h2>Outfits</h2><div id="outfits"></div><h2>Clothing</h2><div id="items"></div><h2>Tattoos</h2><label for="gender">Tattoo character</label><select id="gender"><option value="male">Male</option><option value="female">Female</option></select><button id="clear">Clear tattoos</button><div id="tattoos"></div></main><script>
let catalog={};const $=id=>document.getElementById(id);const send=(route,data={})=>fetch(`https://${GetParentResourceName()}/${route}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).catch(()=>{$('status').textContent='Could not send the preview action.'});
function render(){let term=$('search').value.toLowerCase();for(const [field,target,route] of [['clothing','items','item'],['outfits','outfits','outfit'],['tattoos','tattoos','tattoo']]){let host=$(target);host.replaceChildren();for(const item of catalog[field]||[]){if(!item.name.toLowerCase().includes(term))continue;let button=document.createElement('button');button.textContent=item.name+(item.slot?' · '+item.slot:'');button.onclick=()=>send(route,{id:item.id,texture:Number($('texture').value),gender:$('gender').value});host.append(button)}}}
window.addEventListener('message',e=>{const data=e.data;if(data.action==='open'){catalog=data.catalog;$('panel').style.display='block';$('search').value='';render();$('search').focus()}if(data.action==='close')$('panel').style.display='none';if(data.action==='status')$('status').textContent=data.message});$('search').oninput=render;$('close').onclick=()=>send('close');$('clear').onclick=()=>send('clearTattoos');$('pose').onchange=()=>send('pose',{pose:$('pose').value});document.addEventListener('keydown',e=>{if(e.key==='Escape')send('close')});
</script></body></html>
